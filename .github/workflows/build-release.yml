name: Build & Release Windows App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows App (Installer & Portable)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          check-latest: true
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install NSIS Compiler
        shell: powershell
        run: |
          choco install nsis -y
          "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Wails App & NSIS Installer
        run: wails build -nsis -clean

      - name: Prepare Installer and Portable Executables
        shell: powershell
        run: |
          # Locate NSIS Installer
          $installer = Get-ChildItem -Path build/bin -Filter "*installer*.exe" | Select-Object -First 1
          if ($installer) {
            Copy-Item $installer.FullName -Destination "build/bin/PharmacyPOS-Setup-Windows.exe"
            Write-Host "Prepared setup installer at build/bin/PharmacyPOS-Setup-Windows.exe"
          } else {
            Write-Warning "NSIS Installer was not generated."
          }

          # Locate Standalone / Portable Executable
          $portable = Get-ChildItem -Path build/bin -Filter "*.exe" | Where-Object { $_.Name -notlike "*installer*" -and $_.Name -notlike "*Setup*" } | Select-Object -First 1
          if ($portable) {
            Copy-Item $portable.FullName -Destination "build/bin/PharmacyPOS-Portable-Windows.exe"
            Write-Host "Prepared portable executable at build/bin/PharmacyPOS-Portable-Windows.exe"
          } else {
            Write-Warning "Portable executable was not found."
          }

      - name: Upload Windows Executables Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PharmacyPOS-Windows-Executables
          path: |
            build/bin/PharmacyPOS-Setup-Windows.exe
            build/bin/PharmacyPOS-Portable-Windows.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            build/bin/PharmacyPOS-Setup-Windows.exe
            build/bin/PharmacyPOS-Portable-Windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
